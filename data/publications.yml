#   3. 정렬은 site.js 가 date 기준으로 처리 (Home·Publications·Research).
#
# - title: Paper Title
#   authors: First Author, Second Author, and Sukyoung Ryu
#   venue: PACMPL OOPSLA 2027
#   date: October 2027
#   link: https://doi.org/10.1145/...
#   award:
#   research:
#
# 칸 설명
#   date      월 + 연도 (October 2027). 아직 미정이면 "To appear 2027"
#   link      논문 링크. 없으면 비워두기
#   award     수상 이름 (예: ACM SIGSOFT Distinguished Paper Award). 없으면 비워두기
#   research  Research 페이지의 어느 분야 아래에 띄울지 (화면에는 안 보이는 표시용 칸)
#             비워두면 Research 페이지에는 안 나옴. 두 분야: "rust, analysis"
#             쓸 수 있는 id (data/settings.yml → research → areas):
#               spec       Mechanized Specifications and Language Testing
#               rust       Automatic C-to-Rust Translation
#               analysis   Program Analysis and Type Systems
#               quantum    Quantum and Probabilistic Programming
#   short     (선택) research 를 쓸 때 Research 페이지 괄호 안 짧은 학회명 (예: OOPSLA 2027). 없으면 venue 사용
#   section   (선택, 드묾) Technical Reports / Refereed Articles / Refereed Chapters in Books — 맨 아래 별도 섹션


