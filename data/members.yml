# ═════════════════════════════════════════════════════════════════════════
#  멤버 전체 (Members 페이지) — 현재 멤버 + Alumni
# ═════════════════════════════════════════════════════════════════════════
# ─ 형식 ──────────────────────────────────────────────────────────────────
#  YAML 서브셋 (site.js 내장 파서): 맵 / 리스트 / 스칼라, 들여쓰기는 스페이스.
#  따옴표 선택, # 주석(줄 전체 또는 값 뒤 " # "), yes/no → bool, 정수 → number.
#  미지원: flow 문법([a, b] / {k: v}), 멀티라인(| >), 앵커. 오류 시 배포 중단 + Actions 로그에 파일:줄.
# ─────────────────────────────────────────────────────────────────────────
#
# ▶ 새 멤버: 해당 카테고리 아래에 블록 추가 (website 없으면 비워두기 → 링크·[🔗] 없이 이름만)
#
#   - name: Gildong Hong
#     website: https://gildong.github.io
#     email: gildong [at] kaist.ac.kr
#
# ▶ 진급 (B.S. → M.S. → Ph.D.): 그 사람 블록(- name: ~ email:)을 잘라서 다른 카테고리 아래에 붙이기.
#
# ▶ 졸업: 블록을 맨 아래 "Alumni:" 아래로 옮기고 세 줄 추가
#     degree: PhD                (PhD 또는 MS)
#     year: 2027                 (졸업 연도)
#     affiliation: Samsung Research   (현재 소속, 모르면 비워두기)
#   Alumni 는 website 가 있어도 링크 없이 이름만 표시됩니다 (복붙한 website 줄은 그대로 둬도 됨).
#
# ▶ 정렬은 자동: 카테고리 안은 성(family name) 알파벳순,
#   Alumni 는 졸업 연도 최신순 → PhD 먼저 → 성 알파벳순.
# ▶ 카테고리 순서 = 화면 순서. 사람이 없는 카테고리는 화면에서 자동으로 숨겨집니다.
#   새 카테고리: "카테고리 이름:" 줄을 만들고 그 아래에 블록 추가.


