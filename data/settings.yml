#  값만 바꾸면 됩니다. 글 안에서  **글자** = 주황색 강조 · [글자](주소) = 링크
#  연구 분야 추가: research.areas 블록 하나 복사 → 새 id (영문 소문자) →
#                  논문의 "research: <id>" 로 그 분야에 논문 표시
# ────────────────────────────────────────────────────────────

# ── Home ────────────────────────────────────────
home:
  # 큰 제목 — 한 줄 = 화면의 한 줄
  headline:
    - Designing, specifying, and analyzing
    - real-world programming languages.
  # 큰 제목 아래 소개 문단
  intro: PLRG is the **Programming Language Research Group** at KAIST School of Computing, led by Professor [Sukyoung Ryu](ryu.html). We develop programming language techniques and tools to help programmers build reliable software, connecting formal foundations with practical challenges in language specification, program analysis, software testing, and automatic program translation.
  # Recent Publications 개수 (가장 최신 논문 N편)
  recent_publications: 5


# ── Research ────────────────────────────────────────
research:
  # Research 페이지 맨 위 소개 문단
  intro: We develop programming language techniques and tools to help programmers build reliable software. Our research connects formal foundations with practical challenges in language specification, program analysis, software testing, and automatic program translation.
  # 연구 분야 — 순서 = 화면 순서 (Home 목록 + Research 페이지)
  #   id          논문 research: 칸에서 쓰는 이름
  #   title       분야 제목
  #   keywords    Home 에서 제목 옆 회색 글자
  #   description Research 페이지 설명 문단
  areas:
    - id: spec
      title: Mechanized Specifications and Language Testing
      keywords: JavaScript, WebAssembly, P4
      description: We mechanize language specifications to generate tools and tests for real-world programming languages, including JavaScript, WebAssembly, and P4. Our techniques detect bugs and inconsistencies in language implementations.

    - id: rust
      title: Automatic C-to-Rust Translation
      keywords: static analysis, program transformation, language models
      description: We automate C-to-Rust translation using static analysis, program transformation, and language models. We aim to preserve program behavior while introducing safer, idiomatic Rust abstractions.

    - id: analysis
      title: Program Analysis and Type Systems
      keywords: multilingual software, machine code, language implementations
      description: We develop static analyses and type systems for reasoning about programs. Our work covers multilingual software, machine code, and the safety guarantees of language implementations.

    - id: quantum
      title: Quantum and Probabilistic Programming
      keywords: quantum circuits, exact inference
      description: We compile probabilistic programs into quantum circuits. We also develop exact inference techniques to test quantum software.


# ── Publications ────────────────────────────────────────
publications:
  # 이 연도 이전 논문은 "Before 2020" 한 섹션으로 묶음
  group_before: 2020

  # section — 연도별 목록 대신 Publications 맨 아래에 따로 모아 보여줄 묶음. 순서 = 화면 순서.
  #   논문 블록에 "section: <이름>" 을 쓰면 그 묶음으로 이동 (Home 의 Recent Publications 에서도 제외).
  #   이름은 아래와 글자 하나까지 같아야 함 (틀리면 배포 검사에서 줄 번호와 함께 실패).
  #   새 묶음이 필요하면 여기에 한 줄 추가.
  sections:
    - Refereed Chapters in Books     # 심사를 거친 책의 챕터
    - Refereed Articles              # 학회·저널 논문이 아닌 기고 (매거진, 행사 발표문 등)
    - Technical Reports              # 기술 보고서
