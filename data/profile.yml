# ── Biography 탭
biography:
  - heading: About
    text: Sukyoung Ryu is a Professor in the School of Computing at KAIST. She earned her BS, MS, and Ph.D. in Computer Science from KAIST and worked at Sun Microsystems and Harvard University before joining KAIST. Her primary research interests include programming languages, software engineering, information security, and quantum computing. She received research awards from Google and Sun Microsystems, and Distinguished Paper Awards from ACM SIGSOFT. She has served as a Program Committee Chair and General Chair for conferences in the Programming Language and Software Engineering communities. She served as an associate editor of IEEE TSE and a member of ACM SIGPLAN EC, and she is currently a co-Chair of ACM SIGPLAN CARES.

  - heading: Selected Honors
    items:
      - MSIT Leader Research Grant (KRW 800 million per year for up to nine years), 2026
      - Deputy Prime Minister's Commendation, 2026
      - KAIST ICT Endowed Chair Professor, 2026
      - Top 100 National R&D Achievements, 2025
      - Full Member of the National Academy of Engineering of Korea, 2025
      - Lim Hyung-Kyu LINKGENESIS Best-Teacher Award, KAIST (Grand Prize), 2025
      - Gaheon Academic Award, 2024
      - ACM ICPC Coach Award, 2024
      - Educator Award, KAIST, 2022
      - Minister of Science and ICT Award, 2021
      - Google ExploreCSR Award, 2020
      - Excellence in Teaching Award, KAIST (Grand Prize), 2019
      - Excellence in Teaching Award, KAIST 2017, 2012
